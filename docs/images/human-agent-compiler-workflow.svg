<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="544" viewBox="0 0 1080 544" role="img" aria-labelledby="title desc">
  <title id="title">LLaMA block：问题如何变成下一轮改进</title>
  <desc id="desc">人确定本轮问题和优先级，Agent 读取 profile、追踪 IR 和代码，实施通用修改，再用数值与设备时间检验。第一轮从重复读权重定位到 M 切分，改进空间提案并修复 strided fill 后得到 37.4 毫秒；第二轮从细碎调用定位到归约展开，采用合法原生归约后得到 17.7 毫秒。失败和新热点反馈到下一轮提问。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#31576b" stroke-width="2" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #16364b; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #526a7a; }
      .flow { fill: none; stroke: #31576b; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="544" rx="16" fill="#fff"/>
  <text x="28" y="44" class="title">一次结果，怎样提出下一道问题？</text>
  <text x="28" y="75" class="body">不是先指定一个高性能 kernel，而是把热点追回编译器的生成机制</text>

  <rect x="28" y="114" width="230" height="174" rx="12" fill="#eef3ff" stroke="#b1c8e9"/>
  <text x="46" y="146" class="small">人 · 问题与优先级</text>
  <text x="46" y="182" class="heading">这一轮先解释什么？</text>
  <text x="46" y="216" class="body">先修有依据的通用热点</text>
  <text x="46" y="244" class="body">更长搜索预算留待后续</text>
  <path class="flow" d="M258 201h34"/>

  <rect x="294" y="114" width="230" height="174" rx="12" fill="#edf9f5" stroke="#a3cdbc"/>
  <text x="312" y="146" class="small">Agent · 调查与定位</text>
  <text x="312" y="182" class="heading">谁生成了这些工作？</text>
  <text x="312" y="216" class="body">profile → IR → 代码</text>
  <text x="312" y="244" class="body">核对循环、数据和调用数</text>
  <path class="flow" d="M524 201h34"/>

  <rect x="560" y="114" width="230" height="174" rx="12" fill="#edf9f5" stroke="#a3cdbc"/>
  <text x="578" y="146" class="small">Agent · 实现与回归</text>
  <text x="578" y="182" class="heading">修改共同生成机制</text>
  <text x="578" y="216" class="body">实现、实际 IR 与测试</text>
  <text x="578" y="244" class="body">重新编译可执行包</text>
  <path class="flow" d="M790 201h34"/>

  <rect x="826" y="114" width="226" height="174" rx="12" fill="#16364b"/>
  <text x="844" y="146" class="small" style="fill:#c0d7e4">实卡 · 检验与反馈</text>
  <text x="844" y="182" class="heading" style="fill:#fff">算对了吗？变快了吗？</text>
  <text x="844" y="216" class="body" style="fill:#e0eef6">完整 PyTorch 对照</text>
  <text x="844" y="244" class="body" style="fill:#e0eef6">设备时间与新的 profile</text>

  <text x="28" y="324" class="small">两轮中的实际内容</text>
  <rect x="28" y="340" width="1024" height="62" rx="8" fill="#f3f6fa"/>
  <text x="46" y="364" class="small">第一轮 · 数据复用</text>
  <text x="46" y="387" class="body">为什么重复读权重？</text>
  <text x="312" y="364" class="body">M 分片重复完整读取</text>
  <text x="312" y="387" class="small">按动态循环对账</text>
  <text x="578" y="364" class="body">空间提案 + fill 修复</text>
  <text x="578" y="387" class="small">NaN 先定位并修复</text>
  <text x="844" y="364" class="body">数值通过 · 37.4 ms</text>
  <text x="844" y="387" class="small">细碎调用成为新线索</text>

  <rect x="28" y="412" width="1024" height="62" rx="8" fill="#f3f6fa"/>
  <text x="46" y="436" class="small">第二轮 · 指令粒度</text>
  <text x="46" y="459" class="body">为什么有数千次小调用？</text>
  <text x="312" y="436" class="body">RMSNorm 逐项归约</text>
  <text x="312" y="459" class="small">旧编译预算成为选择门槛</text>
  <text x="578" y="436" class="body">合法归约优先 native</text>
  <text x="578" y="459" class="small">覆盖短归约与尾部</text>
  <text x="844" y="436" class="body">数值通过 · 17.7 ms</text>
  <text x="844" y="459" class="small">再次观察剩余工作</text>

  <path class="flow" d="M939 474v40H16V272h10"/>
  <rect x="394" y="495" width="370" height="30" fill="#fff"/>
  <text x="411" y="515" class="body">失败、新热点和退化，回到下一轮提问</text>
</svg>
