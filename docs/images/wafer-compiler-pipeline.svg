<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Wafer Compiler 编译流水线</title>
  <desc id="desc">从 StableHLO 输入、经过 MLIR lowering 到 package 执行的流水线图。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="22" fill="#f8fafc"/>
  <rect width="1200" height="72" rx="22" fill="url(#header)"/>
  <rect y="50" width="1200" height="22" fill="url(#header)"/>
  <text x="48" y="45" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Wafer Compiler</text>
  <text x="1150" y="44" text-anchor="end" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="16">MLIR → 可执行 package</text>

  <g font-family="Inter,Arial,sans-serif">
    <text x="62" y="112" fill="#0f172a" font-size="16" font-weight="700">输入</text>
    <text x="62" y="135" fill="#475569" font-size="14">框架导出与程序验证</text>
    <text x="62" y="262" fill="#0f172a" font-size="16" font-weight="700">编译器</text>
    <text x="62" y="285" fill="#475569" font-size="14">结构化 IR 与物理 lowering</text>
    <text x="62" y="366" fill="#0f172a" font-size="16" font-weight="700">输出</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="62" y="153" width="170" height="76" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="147" y="184" text-anchor="middle" fill="#0c4a6e" font-size="17" font-weight="700">StableHLO</text>
    <text x="147" y="207" text-anchor="middle" fill="#075985" font-size="13">程序目录</text>
    <rect x="280" y="153" width="170" height="76" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="365" y="184" text-anchor="middle" fill="#0c4a6e" font-size="17" font-weight="700">SPMD</text>
    <text x="365" y="207" text-anchor="middle" fill="#075985" font-size="13">卡内程序</text>

    <rect x="500" y="300" width="180" height="76" rx="12" fill="#ecfccb" stroke="#84cc16" stroke-width="2"/>
    <text x="590" y="331" text-anchor="middle" fill="#365314" font-size="17" font-weight="700">TensorProgram</text>
    <text x="590" y="354" text-anchor="middle" fill="#3f6212" font-size="13">Linalg / Tensor IR</text>
    <rect x="720" y="300" width="180" height="76" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="810" y="331" text-anchor="middle" fill="#78350f" font-size="17" font-weight="700">none | search</text>
    <text x="810" y="354" text-anchor="middle" fill="#92400e" font-size="13">物理数据流</text>
    <rect x="940" y="300" width="180" height="76" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="1030" y="331" text-anchor="middle" fill="#78350f" font-size="17" font-weight="700">TileRegion</text>
    <text x="1030" y="354" text-anchor="middle" fill="#92400e" font-size="13">layout / movement / Instr</text>

    <rect x="500" y="153" width="180" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="590" y="184" text-anchor="middle" fill="#1e293b" font-size="17" font-weight="700">DeviceExecutable</text>
    <text x="590" y="207" text-anchor="middle" fill="#475569" font-size="13">已验证的 Tile entry</text>
    <rect x="720" y="153" width="180" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="810" y="184" text-anchor="middle" fill="#1e293b" font-size="17" font-weight="700">Package</text>
    <text x="810" y="207" text-anchor="middle" fill="#475569" font-size="13">manifest、module 与 data</text>
    <rect x="940" y="153" width="180" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="1030" y="184" text-anchor="middle" fill="#1e293b" font-size="17" font-weight="700">Runtime</text>
    <text x="1030" y="207" text-anchor="middle" fill="#475569" font-size="13">no-card / board</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M232 191h42"/><path d="M450 191h42"/>
    <path d="M680 191h32"/><path d="M900 191h32"/>
    <path d="M590 292v-56"/><path d="M810 292v-56"/><path d="M1030 292v-56"/>
  </g>
  <text x="62" y="407" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">每个阶段都消费前一阶段生成并验证的 IR。</text>
</svg>
