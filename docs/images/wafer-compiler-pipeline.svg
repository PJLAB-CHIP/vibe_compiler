<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Wafer Compiler 主线架构</title>
  <desc id="desc">输入经过前端和 SPMD 形成 TensorProgram，在 none 与 search 之间选择后进入一套共享实现的 current-IR stages，最后生成 package 并交给运行时。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0369a1"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1500" height="760" rx="22" fill="#f8fafc"/>
  <rect width="1500" height="78" rx="22" fill="url(#header)"/>
  <rect y="54" width="1500" height="24" fill="url(#header)"/>
  <text x="52" y="49" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">Wafer Compiler 主线架构</text>
  <text x="1448" y="48" text-anchor="end" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="16">verified IR → package</text>

  <g font-family="Inter,Arial,sans-serif">
    <text x="64" y="116" fill="#0f172a" font-size="16" font-weight="700">输入与归一化</text>
    <text x="64" y="139" fill="#475569" font-size="14">前端、SPMD 和 structured normalization 只执行一次</text>
    <text x="64" y="240" fill="#0f172a" font-size="16" font-weight="700">策略分叉</text>
    <text x="64" y="263" fill="#475569" font-size="14">下游实现相同，transaction 和 current IR 独立</text>
    <text x="64" y="551" fill="#0f172a" font-size="16" font-weight="700">显式外部输入</text>
    <text x="700" y="551" fill="#0f172a" font-size="16" font-weight="700">accepted 输出与执行</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="64" y="160" width="220" height="62" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="174" y="197" text-anchor="middle" fill="#0c4a6e" font-size="17" font-weight="700">StableHLO program</text>
    <text x="174" y="216" text-anchor="middle" fill="#075985" font-size="12">program directory</text>
    <rect x="334" y="160" width="250" height="62" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="459" y="197" text-anchor="middle" fill="#0c4a6e" font-size="17" font-weight="700">前端验证 + SPMD</text>
    <text x="459" y="216" text-anchor="middle" fill="#075985" font-size="12">card-local StableHLO</text>
    <rect x="634" y="160" width="330" height="62" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="799" y="197" text-anchor="middle" fill="#166534" font-size="17" font-weight="700">verified TensorProgram</text>
    <text x="799" y="216" text-anchor="middle" fill="#15803d" font-size="12">Linalg / Tensor / SCF + e-graph</text>

    <rect x="350" y="276" width="250" height="66" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="475" y="306" text-anchor="middle" fill="#78350f" font-size="19" font-weight="700">none</text>
    <text x="475" y="328" text-anchor="middle" fill="#92400e" font-size="13">确定性 baseline transaction</text>
    <rect x="650" y="276" width="250" height="66" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="775" y="306" text-anchor="middle" fill="#78350f" font-size="19" font-weight="700">search</text>
    <text x="775" y="328" text-anchor="middle" fill="#92400e" font-size="13">有界 current-IR transaction</text>
  </g>

  <rect x="60" y="354" width="1380" height="174" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="750" y="382" text-anchor="middle" fill="#7c2d12" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">共享 atomic stage 实现（不共享 candidate state）</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="100" y="407" width="180" height="86" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="190" y="440" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="700">Spatial / Region</text>
    <text x="190" y="463" text-anchor="middle" fill="#9a3412" font-size="12">TileRegion + FA/FD state</text>
    <text x="190" y="482" text-anchor="middle" fill="#9a3412" font-size="12">actual structural IR</text>
    <rect x="320" y="407" width="180" height="86" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="410" y="440" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="700">Temporal tiling</text>
    <text x="410" y="463" text-anchor="middle" fill="#9a3412" font-size="12">tile-and-fuse</text>
    <text x="410" y="482" text-anchor="middle" fill="#9a3412" font-size="12">live operation interfaces</text>
    <rect x="540" y="407" width="180" height="86" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="630" y="440" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="700">Attention decomposition</text>
    <text x="630" y="463" text-anchor="middle" fill="#9a3412" font-size="12">QK / state / PV</text>
    <text x="630" y="482" text-anchor="middle" fill="#9a3412" font-size="12">actual Linalg / Tensor / SCF</text>
    <rect x="760" y="407" width="180" height="86" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="850" y="440" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="700">Layout + bufferize</text>
    <text x="850" y="463" text-anchor="middle" fill="#9a3412" font-size="12">IndexRelation + PBQP</text>
    <text x="850" y="482" text-anchor="middle" fill="#9a3412" font-size="12">actual view / allocation</text>
    <rect x="980" y="407" width="205" height="86" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="1082" y="440" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="700">Movement + execution</text>
    <text x="1082" y="463" text-anchor="middle" fill="#9a3412" font-size="12">boundary / pipeline / fanout</text>
    <text x="1082" y="482" text-anchor="middle" fill="#9a3412" font-size="12">current Tile IR</text>
    <rect x="1225" y="407" width="175" height="86" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="1312" y="440" text-anchor="middle" fill="#7c2d12" font-size="16" font-weight="700">Instr + completion</text>
    <text x="1312" y="463" text-anchor="middle" fill="#9a3412" font-size="12">SPM / DDR / transport</text>
    <text x="1312" y="482" text-anchor="middle" fill="#9a3412" font-size="12">actual leaf gate</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="64" y="580" width="250" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="189" y="610" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="700">Target topology / facts</text>
    <text x="189" y="633" text-anchor="middle" fill="#475569" font-size="12">Tile、mesh、target capability</text>
    <rect x="350" y="580" width="250" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="475" y="610" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="700">ProgramData / bindings</text>
    <text x="475" y="633" text-anchor="middle" fill="#475569" font-size="12">payload、range、entry arguments</text>
    <rect x="700" y="580" width="250" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="825" y="610" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">DeviceExecutable</text>
    <text x="825" y="633" text-anchor="middle" fill="#155e75" font-size="12">accepted all-and-only Tile entries</text>
    <rect x="1000" y="580" width="250" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="1125" y="610" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">Target module + package</text>
    <text x="1125" y="633" text-anchor="middle" fill="#155e75" font-size="12">manifest、modules、data</text>
    <rect x="1300" y="580" width="140" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="1370" y="610" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">运行时</text>
    <text x="1370" y="633" text-anchor="middle" fill="#155e75" font-size="12">no-card / board</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M284 191h44"/><path d="M584 191h44"/>
    <path d="M799 222v31H475v17"/><path d="M799 222v31H775v17"/>
    <path d="M475 342v41H190v18" stroke="#0369a1" marker-end="url(#arrow-blue)"/>
    <path d="M775 342v41H190v18" stroke="#b45309" marker-end="url(#arrow-amber)"/>
    <path d="M280 450h35"/><path d="M500 450h35"/><path d="M720 450h35"/><path d="M940 450h35"/><path d="M1185 450h35"/>
    <path d="M1312 493v70H950"/><path d="M950 615h44"/><path d="M1250 615h44"/>
  </g>
  <g fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-blue)">
    <path d="M189 580v-70"/><path d="M475 580v-70"/><path d="M314 615h380"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#64748b" font-size="13">
    <text x="64" y="700">蓝色与琥珀色箭头表示两条独立 transaction 进入同一套实现；它们的 current IR 和 accepted result 仍分别管理。</text>
    <text x="64" y="726">只有实际物化并通过 verifier、memory 和 target gate 的结果才会进入 package。</text>
  </g>
</svg>
